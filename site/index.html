<dt>Date window</dt><dd>Limits every number on the page to games played between the two dates, and re-runs the opponent adjustment on just those games.</dd>
<dt>Conference only / No bowls</dt><dd>Drops non-conference or postseason games from the window before anything is computed.</dd>
<dt>Rows</dt><dd>Shows individual teams, or averages each conference's members into one row.</dd>
<dt>Conference / Find team</dt><dd>Filters which rows display; ranks are still computed against all of FBS.</dd>
<dt>Column headers</dt><dd>Click to sort; click again to flip direction.</dd>
<dt>Team rows</dt><dd>Click a team to open its game-by-game log for the window.</dd>
</dl></section>
<section><h2>Stats</h2><dl>
<dt>Rating</dt><dd>Points per game better or worse than an average FBS team on a neutral field: 60% from adjusted offense, defense and special-teams efficiency, 40% from opponent-adjusted scoring margin. The difference between two teams' Ratings, plus 3 points for the home team, is the projected margin.</dd>
<dt>AdjO</dt><dd>Opponent-adjusted expected points added per offensive play; higher is better.</dd>
<dt>AdjD</dt><dd>Opponent-adjusted expected points allowed per defensive play; lower is better.</dd>
<dt>AdjST</dt><dd>Opponent-adjusted points per game gained or lost on special teams: kickoffs, punts and their returns, plus field goals and extra points on both sides.</dd>
<dt>Tempo</dt><dd>Seconds of game clock per offensive snap within drives; lower is faster, and it is a style, not a strength.</dd>
<dt>Talent</dt><dd>Average 247Sports composite rating of the top 22 rated offensive and top 22 defensive players on the roster.</dd>
<dt>Perf</dt><dd>Performance vs talent: Rating minus what a straight-line fit across FBS predicts from Talent; positive means the team is beating its roster.</dd>
<dt>SOS</dt><dd>Strength of schedule: the average Rating of the opponents a team has played in the window; higher means a tougher schedule.</dd>
<dt>Off EPA/p, Def EPA/p</dt><dd>Raw expected points added per play on offense, and allowed on defense, with no schedule adjustment.</dd>
<dt>Off SR, Def SR</dt><dd>Success rate: the share of plays that keep the offense on schedule (50% of needed yards on 1st down, 70% on 2nd, 100% on 3rd and 4th), for the offense and allowed by the defense.</dd>
<dt>ST pts/g</dt><dd>Raw special-teams points per game: kickoffs and punts against an average unit from the same field position, plus field goals and extra points against an average kicker from the same distance.</dd>
<dt>Off, Def, ST (Talent tab)</dt><dd>Composite rating of the top 22 offensive players, the top 22 defensive players, and the kicker, punter and long snapper.</dd>
<dt>Off Perf, Def Perf, ST Perf</dt><dd>Each unit's adjusted efficiency minus what its own talent predicts; Def Perf is flipped so positive is always good.</dd>
<dt>Field goals in ST</dt><dd>Each field goal counts as 3 points times (made minus the league make rate from that distance), so a made 50-yarder earns more than a made 25-yarder and a missed 25-yarder costs more than a missed 50-yarder; extra points work the same way, and the opponent's kicks count against you, which credits field-goal defense.</dd>
<dt>Small grey numbers</dt><dd>National rank in that column among all FBS teams in the window.</dd>
<dt>GP, W-L, Rk</dt><dd>Games played in the window, record in those games, and overall rank by Rating.</dd>
</dl></section>
<section><h2>Method</h2><dl>
<dt>Expected points (EPA)</dt><dd>The change in how many points a drive is expected to produce from before a play to after it, from the cfbfastR model on ESPN play-by-play.</dd>
<dt>Opponent adjustment</dt><dd>Each game is credited against the opponent's adjusted strength and a 3-point home-field term, then iterated to convergence; for a full-season view, last season's ratings plus this year's roster talent count as about three games of evidence, so early-season numbers don't swing on one result.</dd>
<dt>Accuracy</dt><dd>Tested week by week against closing spreads in 2025 and 2026, the projected margins miss the final score by about 0.5 to 1 point more per game than the betting line does.</dd>
<dt>What's excluded</dt><dd>Games against FCS opponents, and garbage-time plays (a lead of more than 38 points in the 2nd quarter, 28 in the 3rd, or 22 in the 4th); single plays are also capped so one fluke doesn't dominate.</dd>
<dt>Seasons</dt><dd>2019 through the current season; the source feed for 2019–2022 covers the regular season and conference championships only, and talent composites exist for 2025 onward, so the Talent columns and Over/Under boards are blank for earlier years.</dd>
<dt>Data freshness</dt><dd>Ratings refresh automatically after each weekend from ESPN play-by-play; the header shows the date of the last game included.</dd>
</dl></section>
<section><h2>About</h2><p class="about">VosCFB.com was built by a former mortgage-backed securities trader who loves college athletics. I can be reached for questions or comments at <span class="em">info@voscfb.com</span>.</p></section>`;
const DEFSORT = { rating: "net", eff: "net", tal: "vnet" };
const NOTES = {
  rating: `<h2>About</h2><p>VosCFB rates every FBS team from play-by-play data: opponent-adjusted efficiency on offense, defense and the kicking game, with roster talent alongside so you can see who is beating their recruiting and who is not.</p><h2>Reading the ratings</h2><p><b>Rating</b> is points per game better or worse than an average FBS team on a neutral field, blending adjusted efficiency (offense, defense, special teams) with adjusted scoring margin. <b>AdjO</b> and <b>AdjD</b> are opponent-adjusted expected points added per play (offense higher is better; defense is what it allows, so lower is better). <b>AdjST</b> is special-teams points per game (kickoffs, punts, field goals and extra points, for and against). <b>Tempo</b> is seconds per offensive snap within drives. <b>Talent</b> is the roster's recruiting composite; <b>Perf</b> is the rating minus what talent alone predicts. <b>SOS</b> is the average Rating of opponents played. Small grey numbers are national ranks.</p><p>Each game is credited against the opponent's adjusted strength and a home-field term, then iterated to convergence. The solve runs in your browser on the games in the selected window. FBS-vs-FBS games only; garbage time removed. Expected points from the cfbfastR model on ESPN play-by-play.</p>`,
  eff: `<h2>Raw columns</h2><p>Unadjusted EPA per play, success rate (plays that stay on schedule), kicking-game points per game, and tempo. Tempo is measured drive-start to next-drive-start so it reflects how fast the offense operates with the ball, not possession length.</p>`,
  tal: `<h2>Talent columns</h2><p>Composites built from 247Sports roster ratings by position: average rating of the top 22 rated offensive players, top 22 defensive players, and the kicker, punter and long snapper. Team is the mean of offense and defense. The Perf columns are the adjusted metric minus a straight-line fit across all FBS teams on that side's talent, so positive means outperforming the roster; Def Perf is flipped so positive is good. Specialists are often unrated, so ST talent is blank for some teams. Nine 2025 rosters were unavailable from 247 and show blank.</p>`,
  faq: "",
  ou: `<h2>Over / under</h2><p>Each board ranks units by performance relative to their talent profile for the selected window: adjusted efficiency minus what the FBS-wide talent fit predicts. Offense and defense Perf are in EPA per play; special teams in points per game. The conference filter narrows the boards; the fit itself always uses all FBS.</p>`,

function bounds() { const g = DATA[state.season].games; let mn = "9", mx = "0"; for (const r of g) { if (r[0] < mn) mn = r[0]; if (r[0] > mx) mx = r[0]; } return [mn, mx]; }
function shift(d, days) { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + days); return t.toISOString().slice(0, 10); }
function filtered() { const [mn, mx] = bounds(); const f = state.from || mn, t = state.to || mx; return DATA[state.season].games.filter(r => r[0] >= f && r[0] <= t && (!state.confonly || r[4]) && (!state.nopost || !r[5])); }
function fit(pairs) { const n = pairs.length; if (n < 8) return null; let sx = 0, sy = 0, sxx = 0, sxy = 0; for (const [x, y] of pairs) { sx += x; sy += y; sxx += x * x; sxy += x * y; } const b = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1); return { a: (sy - b * sx) / n, b }; }

function compute(rows) {
  const T = {};

    const t = T[r[1]] ||= { g: 0, w: 0, l: 0, oP: 0, oE: 0, oS: 0, dP: 0, dE: 0, dS: 0, st: 0, ps: 0, pn: 0, log: [] };
    t.g++; if (r[6] != null && r[7] != null) { r[6] > r[7] ? t.w++ : r[6] < r[7] ? t.l++ : 0; }
    t.oP += r[8]; t.oE += r[9]; t.oS += r[10]; t.dP += r[11]; t.dE += r[12]; t.dS += r[13]; t.st += stv(r); t.ps += r[16]; t.pn += r[17]; t.log.push(r);
  }
  // Model settings (chosen by walk-forward backtest vs closing spreads, 2025-26; see pipeline/model.py)
  const HFA = 3.0, K = 0.5, PRIOR_W = 3.0, ST_W = 1.5, SCALE = 1.1, MOV_W = 0.4, MOV_CAP = 28;

  const pr = (k, i) => (prior && prior[k] ? prior[k][i] : 0);

  for (let it = 0; it < 40; it++) {

        so += (r[9] / r[8] - mu - loc * hfa) - (aD_[opp] || 0); sd += (r[12] / r[11] - mu + loc * hfa) - (aO_[opp] || 0); ss += stv(r) + (aS_[opp] || 0);
        if (r[6] != null && r[7] != null) { sm += Math.max(-MOV_CAP, Math.min(MOV_CAP, r[6] - r[7])) - loc * HFA + (M_[opp] || 0); nm++; } }

  for (const k of names) { const t = T[k];
    out.push({ id: k, name: k, sub: DATA[state.season].teams[k] || "—", g: t.g, rec: `${t.w}-${t.l}`, log: t.log, v: {
      net: (1 - MOV_W) * SCALE * ((aO_[k] - aD_[k]) * P + ST_W * aS_[k]) + MOV_W * M_[k], aoff: mu + aO_[k], adef: mu + aD_[k], ast: aS_[k],

}
function confRows(teams) {
  const by = {}; for (const t of teams) (by[t.sub] ||= []).push(t);
  const ids = new Set(Object.values(COLSETS).flat().map(c => c.id));
  return Object.entries(by).map(([c, ts]) => { const v = {}; for (const id of ids) { const xs = ts.map(t => t.v[id]).filter(x => x != null); v[id] = xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null; }
    return { id: "c:" + c, name: c, sub: ts.length + " teams", g: ts.reduce((s, t) => s + t.g, 0), rec: "", v }; });
}
function ranker(all, c) { const s = all.map(r => r.v[c.id]).filter(v => v != null).sort((a, b) => c.lower ? a - b : b - a); return v => v == null ? null : s.indexOf(v) + 1; }
function cell(c, v, rk, isTeam) {
  if (v == null) return `<td class="${c.sep ? "sep" : ""}">—</td>`;
  const cls = [c.sep ? "sep" : "", c.signed ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : ""].join(" ");
  return `<td class="${cls}" style="${c.bold ? "font-weight:700" : ""}">${c.fmt(v)}${c.rank && isTeam && rk != null ? `<sub class="r">${rk}</sub>` : ""}</td>`;
}

async function ensureSeason(y) {

  try { const r = await fetch(`data/${y}.json`); if (!r.ok) throw new Error(r.status); DATA[y] = await r.json(); return true; }
  catch (e) { $("stat").textContent = `Could not load ${y} data (${e.message}).`; return false; }
}
function render() {
  if (!DATA[state.season]) { $("stat").textContent = `Loading ${state.season}…`; ensureSeason(state.season).then(ok => { if (!ok) { state.season = SEASONS[SEASONS.length - 1]; } render(); }); return; }
  const [mn, mx] = bounds();
  for (const b of $("tabs").children) b.setAttribute("aria-selected", b.dataset.v === state.view);

  $("season").innerHTML = [...SEASONS].reverse().map(y => `<option value="${y}" ${y === state.season ? "selected" : ""}>${y}</option>`).join("");
  for (const b of $("mode").children) b.setAttribute("aria-pressed", b.dataset.v === state.mode);

  $("from").min = $("to").min = mn; $("from").max = $("to").max = mx;

  const faq = state.view === "faq", ou = state.view === "ou" || faq, isTeam = state.mode === "team" || ou;

  $("hint").textContent = ou ? "" : "Click a team for its game log. Small numbers are national ranks.";
  if (ou) { renderBoards(teams); save(); return; }

  $("grp").innerHTML = GRPS[state.view];

        const o = sgn(g[9] / g[8], 3), d = sgn(g[12] / g[11], 3), s = sgn(stv(g), 1), pc = g[17] ? (g[16] / g[17]).toFixed(1) : "—";
        const tail = state.view === "eff" ? `<td class="sep"></td><td></td><td></td><td></td><td class="sep">${o}</td><td>${d}</td><td>${pctf(g[10] / g[8])}</td><td>${pctf(g[13] / g[11])}</td><td>${s}</td><td>${pc}</td>`
          : state.view === "tal" ? `<td class="sep"></td><td class="sep"></td><td></td><td></td><td></td><td class="sep">${o}</td><td>${d}</td><td>${s}</td><td></td>`
          : `<td class="sep"></td><td>${o}</td><td>${d}</td><td>${s}</td><td>${pc}</td><td class="sep"></td><td></td>`;
        html.push(`<tr class="log${j === log.length - 1 ? " last" : ""}"><td class="sticky l" title="${g[2]}">${g[0].slice(5)} · ${where} ${nm(g[2])}${g[5] ? " (post)" : ""}</td><td class="l conf">${g[4] ? "conf" : "non-conf"}</td><td></td><td class="${cls}">${res}</td><td></td>${tail}</tr>`);

}

function renderBoards(teams) {
  const units = [
    { title: "Offense", tal: "toff", adj: "aoff", res: "voff", unit: "EPA/play", fmtA: v => sgn(v, 3), fmtR: v => sgn(v, 3) },
    { title: "Defense", tal: "tdef", adj: "adef", res: "vdef", unit: "EPA/play allowed", fmtA: v => sgn(v, 3), fmtR: v => sgn(v, 3) },
    { title: "Special teams", tal: "tst", adj: "ast", res: "vst", unit: "pts/game", fmtA: v => sgn(v, 1), fmtR: v => sgn(v, 1) },
  ];
  const pool = state.conf === "All" ? teams : teams.filter(t => t.sub === state.conf);
  $("boards").innerHTML = units.map(u => {
    const list = pool.filter(t => t.v[u.res] != null).sort((a, b) => b.v[u.res] - a.v[u.res]);
    const n = list.length, tbl = (rows, label, start) => `<h3>${label}</h3><div class="bx"><table><thead><tr><th class="l">#</th><th class="l">Team</th><th>Talent</th><th>Adj</th><th>Perf</th></tr></thead><tbody>` +
      rows.map((t, i) => `<tr class="team"><td class="l rk">${start + i}</td><td class="l team" title="${t.name}">${ab(t.name)}<sub class="r">${cab(t.sub)}</sub></td><td>${t.v[u.tal].toFixed(1)}</td><td>${u.fmtA(t.v[u.adj])}</td><td class="${t.v[u.res] > 0 ? "pos" : "neg"}" style="font-weight:700">${u.fmtR(t.v[u.res])}</td></tr>`).join("") + `</tbody></table></div>`;
    return `<div class="board"><h2>${u.title} <span class="tag">· ${u.unit} · ${n} teams</span></h2>${n ? tbl(list.slice(0, 5), "Overachieving", 1) + tbl(list.slice(-5), "Underachieving", Math.max(1, n - 4)) : `<div class="empty">Not enough rated teams.</div>`}</div>`;
  }).join("");
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("#tabs button"); if (tab) { state.view = tab.dataset.v; render(); return; }
  const b = e.target.closest("button[data-v]");
  if (b) { const id = b.parentElement.id;
    if (id === "preset") { const [mn, mx] = bounds(); state.to = ""; state.from = b.dataset.v === "all" ? "" : shift(mx, b.dataset.v === "l30" ? -30 : -14); if (state.from < mn) state.from = ""; }
    else state[id] = b.dataset.v; render(); return; }
  const s = e.target.closest("button[data-sort]");
  if (s) { const id = s.dataset.sort, cur = state.sort[state.view] || DEFSORT[state.view]; state.dir[state.view] = cur === id ? -(state.dir[state.view] ?? -1) : -1; state.sort[state.view] = id; render(); return; }
  const tr = e.target.closest("tr.team[data-id]");
  if (tr && state.mode === "team") { const id = tr.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
});
document.addEventListener("keydown", (e) => { const tr = e.target.closest && e.target.closest("tr.team[data-id]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); } });
$("season").addEventListener("change", e => { state.season = e.target.value; state.from = ""; state.to = ""; render(); });
$("from").addEventListener("change", e => { state.from = e.target.value; if (state.to && state.from > state.to) state.to = state.from; render(); });
$("to").addEventListener("change", e => { state.to = e.target.value; if (state.from && state.to < state.from) state.from = state.to; render(); });
$("confonly").addEventListener("change", e => { state.confonly = e.target.checked; render(); });
$("nopost").addEventListener("change", e => { state.nopost = e.target.checked; render(); });
$("conf").addEventListener("change", e => { state.conf = e.target.value; render(); });
$("q").addEventListener("input", e => { state.q = e.target.value; render(); $("q").focus(); });
render();
</script>
